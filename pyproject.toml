[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fizeau-gui"
version = "1.0.0"
description = "Fizeau interferogram phase extraction and wavefront analysis GUI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Zekun Zhang" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "PySide6>=6.5",
]

[project.urls]
Homepage = "https://github.com/MarvelousZK/FizeauGUI"
Repository = "https://github.com/MarvelousZK/FizeauGUI"

[project.scripts]
fizeau-gui = "fizeau_gui.gui:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fizeau_gui = ["assets/*.ico"]
